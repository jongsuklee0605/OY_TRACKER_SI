name: olive-stock

on:
  schedule:
    - cron: "17 */6 * * *"   # 혹시 반복이 끊겼을 때 다시 살리는 예비용
  workflow_dispatch: {}

concurrency:
  group: olive-stock
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  INTERVAL: 1800        # 체크 간격(초). 30분=1800, 10분=600
  LOOP_MINUTES: 320     # 한 번 실행에서 반복하는 시간(분)

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SHARDS: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.65.0

      - name: Install
        run: |
          pip install playwright==1.65.0
          playwright install chromium

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: olive_stock_state.json
          key: olive-stock-s${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            olive-stock-s${{ matrix.shard }}-

      - name: Run monitor (loop)
        env:
          MODE: stock
          SHARD: ${{ matrix.shard }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_STOCK }}
          GOODS_NO_ALL: ${{ secrets.GOODS_NO }}
        run: |
          GOODS_NO=$(python -c "
          import os, zlib
          g = list(dict.fromkeys(x.strip() for x in os.environ['GOODS_NO_ALL'].split(',') if x.strip()))
          s, n = int(os.environ['SHARD']), int(os.environ['SHARDS'])
          print(','.join(x for x in g if zlib.crc32(x.encode()) % n == s))
          ")
          if [ -z "$GOODS_NO" ]; then
            echo "No items for shard $SHARD"; exit 0
          fi
          export GOODS_NO

          END=$((SECONDS + LOOP_MINUTES * 60))
          while [ $SECONDS -lt $END ]; do
            START=$SECONDS
            echo "===== $(TZ=Asia/Seoul date '+%m/%d %H:%M') 체크 시작 ====="
            python olive_monitor.py || echo "이번 회차 실패, 다음 회차 계속"
            WAIT=$((INTERVAL - (SECONDS - START)))
            if [ $((SECONDS + WAIT)) -ge $END ]; then break; fi
            [ $WAIT -gt 0 ] && sleep $WAIT
          done

      - name: Save state
        if: always() && hashFiles('olive_stock_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: olive_stock_state.json
          key: olive-stock-s${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}

  next:
    needs: run
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: 다음 실행 예약
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run olive-stock.yml --repo ${{ github.repository }} --ref main
